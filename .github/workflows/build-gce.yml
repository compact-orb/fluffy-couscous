name: Build GCE

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile in repository:profile format"
        required: true
        type: string

env:
  SUDO_PRESERVE_ENV: "\
    GENTOO_MIRROR_URL,REPOS,BINPKG_REPOS,ANSIBLE_PULL_URL,SIGNING_KEY,\
    BINPKG_PUBLIC_KEY,REPO_PUBLIC_KEYS,S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY,\
    S3_RO_SECRET_ACCESS_KEY,S3_REGION,S3_ENDPOINT,S3_BUCKET_NAME,SECUREBOOT_KEY,\
    SECUREBOOT_CERT,STORAGETO_KEY,IMAGE_USER,IMAGE_SSH_PUBLIC_KEY"
  GENTOO_MIRROR_URL: ${{ vars.GENTOO_MIRROR_URL }}
  REPOS: ${{ vars.REPOS }}
  BINPKG_REPOS: ${{ vars.BINPKG_REPOS }}
  ANSIBLE_PULL_URL: ${{ vars.ANSIBLE_PULL_URL }}
  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
  BINPKG_PUBLIC_KEY: ${{ vars.BINPKG_PUBLIC_KEY }}
  REPO_PUBLIC_KEYS: ${{ vars.REPO_PUBLIC_KEYS }}
  S3_ACCESS_KEY_ID: ${{ vars.S3_ACCESS_KEY_ID }}
  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
  S3_RO_SECRET_ACCESS_KEY: ${{ secrets.S3_RO_SECRET_ACCESS_KEY }}
  S3_REGION: ${{ vars.S3_REGION }}
  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
  S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
  SECUREBOOT_KEY: ${{ secrets.SECUREBOOT_KEY }}
  SECUREBOOT_CERT: ${{ vars.SECUREBOOT_CERT }}
  STORAGETO_KEY: ${{ secrets.STORAGETO_KEY }}
  IMAGE_USER: ${{ vars.IMAGE_USER }}
  IMAGE_SSH_PUBLIC_KEY: ${{ secrets.IMAGE_SSH_PUBLIC_KEY }}

jobs:
  build-gce:
    name: Build GCE
    runs-on: ubuntu-26.04
    steps:
      - uses: compact-orb/optimize-runner-network@v1

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tools

      - name: Install Host Dependencies
        run: |
          sudo apt update
          sudo apt install --no-install-recommends --yes \
            btrfs-progs criu dosfstools

      - name: Run build-gce.sh
        run: |
          # Workaround for stripping carriage return characters from GitHub
          # Actions environment variables set via the web interface.
          for var in ${SUDO_PRESERVE_ENV//,/ }; do
            declare -n ref="${var}"
            ref="${ref//$'\r'/}"
          done
          # Workaround for missing `/run/user/0`.
          sudo mkdir --mode="0700" --parents "/run/user/0"

          sudo --preserve-env=${SUDO_PRESERVE_ENV} \
            bin/build-gce.sh --profile="${{ inputs.profile }}"
