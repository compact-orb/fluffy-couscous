name: Bootstrap

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile in repository:profile format"
        required: true
        type: string
      seed_arch:
        description: "Stage seed architecture (defaults from profile)"
        required: false
        type: string
      seed_name:
        description: "Stage seed tarball name (defaults for arm64/amd64)"
        required: false
        type: string
      seed_stage:
        description: "Custom stage3 profile to use as seed"
        required: false
        type: string
      workaround:
        description: "Apply bootstrap workaround instead of default"
        required: false
        type: boolean
        default: false
      jobs:
        description: "Enable parallel emerge jobs using nproc"
        required: false
        type: boolean
        default: false
      timeout:
        description: "Timeout duration for emerge (e.g. 330m)"
        required: false
        type: string
        default: "330m"

jobs:
  bootstrap:
    name: Bootstrap
    uses: ./.github/workflows/_resumable-pipeline.yml
    with:
      mode: bootstrap
      max_attempts: 8
      profile: ${{ inputs.profile }}
      seed_arch: ${{ inputs.seed_arch }}
      seed_name: ${{ inputs.seed_name }}
      seed_stage: ${{ inputs.seed_stage }}
      workaround: ${{ inputs.workaround }}
      jobs: ${{ inputs.jobs }}
      timeout: ${{ inputs.timeout }}
    secrets: inherit
