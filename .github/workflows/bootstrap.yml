name: Bootstrap

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile in repository:profile format"
        required: true
        type: string
      seed_arch:
        description: "Stage seed architecture (e.g. amd64)"
        required: false
        type: string
      seed_name:
        description: "Stage seed tarball name"
        required: false
        type: string
      seed_stage:
        description: "Custom stage3 profile to use as seed"
        required: false
        type: string
      workaround:
        description: "Apply bootstrap workaround instead of full rebuild"
        required: false
        type: boolean
        default: false
      timeout:
        description: "Timeout duration for emerge (e.g. 330m or 30m)"
        required: false
        type: string
        default: "330m"

env:
  SUDO_PRESERVE_ENV: GENTOO_MIRROR_URL,REPOS,BINPKG_REPOS,SIGNING_KEY,BINPKG_PUBLIC_KEY,REPO_PUBLIC_KEYS,S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY,S3_REGION,S3_ENDPOINT,S3_BUCKET_NAME,SECUREBOOT_KEY,SECUREBOOT_CERT,STORAGETO_KEY
  GENTOO_MIRROR_URL: ${{ vars.GENTOO_MIRROR_URL }}
  REPOS: ${{ vars.REPOS }}
  BINPKG_REPOS: ${{ vars.BINPKG_REPOS }}
  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
  BINPKG_PUBLIC_KEY: ${{ vars.BINPKG_PUBLIC_KEY }}
  REPO_PUBLIC_KEYS: ${{ vars.REPO_PUBLIC_KEYS }}
  S3_ACCESS_KEY_ID: ${{ vars.S3_ACCESS_KEY_ID }}
  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
  S3_REGION: ${{ vars.S3_REGION }}
  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
  S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
  SECUREBOOT_KEY: ${{ secrets.SECUREBOOT_KEY }}
  SECUREBOOT_CERT: ${{ vars.SECUREBOOT_CERT }}
  STORAGETO_KEY: ${{ secrets.STORAGETO_KEY }}
  BUILD_TIMEOUT: ${{ inputs.timeout || '330m' }}
  TOOL_RCLONE_VERSION: "v1.75.2"
  TOOL_STORAGETO_VERSION: "v0.5.0"

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-26.04
    steps:
      - uses: compact-orb/optimize-runner-network@v1

      - uses: actions/checkout@v7

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@v6
        with:
          path: ~/.cache/tools
          key: tools-${{ runner.os }}-${{ env.TOOL_RCLONE_VERSION }}-${{ env.TOOL_STORAGETO_VERSION }}

      - name: Install Dependencies
        run: |
          mkdir --parents "${HOME}/.cache/tools"
          if [[ ! -x "${HOME}/.cache/tools/rclone" ]]; then
            aria2c --dir="/tmp" \
              "https://downloads.rclone.org/${TOOL_RCLONE_VERSION}/rclone-${TOOL_RCLONE_VERSION}-linux-amd64.zip"
            unzip -j "/tmp/rclone-${TOOL_RCLONE_VERSION}-linux-amd64.zip" \
              "*/rclone" -d "${HOME}/.cache/tools"
            rm --force "/tmp/rclone-${TOOL_RCLONE_VERSION}-linux-amd64.zip"
            chmod 0755 "${HOME}/.cache/tools/rclone"
          fi
          if [[ ! -x "${HOME}/.cache/tools/storageto" ]]; then
            aria2c --dir="/tmp" \
              "https://github.com/storageto/cli/releases/download/${TOOL_STORAGETO_VERSION}/storageto-linux-amd64.tar.gz"
            tar --directory="${HOME}/.cache/tools" --extract \
              --file="/tmp/storageto-linux-amd64.tar.gz"
            rm --force "/tmp/storageto-linux-amd64.tar.gz"
            chmod 0755 "${HOME}/.cache/tools/storageto"
          fi
          sudo cp "${HOME}/.cache/tools/rclone" \
            "${HOME}/.cache/tools/storageto" /usr/local/bin/
          sudo chown root:root /usr/local/bin/rclone /usr/local/bin/storageto

      - name: Prune Stale Snapshots
        run: |
          source lib/common.sh
          source lib/build.sh
          # Purge any abandoned resume snapshots older than 24 hours
          s3_rclone delete --min-age="24h" \
            ":s3:${S3_BUCKET_NAME}/resumes/" || true

  bootstrap-attempt-1:
    name: Bootstrap (Attempt 1)
    needs: setup
    runs-on: ubuntu-26.04
    steps:
      - uses: compact-orb/optimize-runner-network@v1

      - uses: actions/checkout@v7

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@v6
        with:
          path: ~/.cache/tools
          key: tools-${{ runner.os }}-${{ env.TOOL_RCLONE_VERSION }}-${{ env.TOOL_STORAGETO_VERSION }}

      - name: Install Dependencies
        run: |
          mkdir --parents "${HOME}/.cache/tools"
          if [[ ! -x "${HOME}/.cache/tools/rclone" ]]; then
            aria2c --dir="/tmp" \
              "https://downloads.rclone.org/${TOOL_RCLONE_VERSION}/rclone-${TOOL_RCLONE_VERSION}-linux-amd64.zip"
            unzip -j "/tmp/rclone-${TOOL_RCLONE_VERSION}-linux-amd64.zip" \
              "*/rclone" -d "${HOME}/.cache/tools"
            rm --force "/tmp/rclone-${TOOL_RCLONE_VERSION}-linux-amd64.zip"
            chmod 0755 "${HOME}/.cache/tools/rclone"
          fi
          if [[ ! -x "${HOME}/.cache/tools/storageto" ]]; then
            aria2c --dir="/tmp" \
              "https://github.com/storageto/cli/releases/download/${TOOL_STORAGETO_VERSION}/storageto-linux-amd64.tar.gz"
            tar --directory="${HOME}/.cache/tools" --extract \
              --file="/tmp/storageto-linux-amd64.tar.gz"
            rm --force "/tmp/storageto-linux-amd64.tar.gz"
            chmod 0755 "${HOME}/.cache/tools/storageto"
          fi
          sudo cp "${HOME}/.cache/tools/rclone" \
            "${HOME}/.cache/tools/storageto" /usr/local/bin/
          sudo chown root:root /usr/local/bin/rclone /usr/local/bin/storageto

      - name: Run bootstrap.sh
        run: |
          # Workaround for stripping carriage return characters from GitHub
          # Actions environment variables set via the web interface.
          for var in ${SUDO_PRESERVE_ENV//,/ }; do
            declare -n ref="${var}"
            ref="${ref//$'\r'/}"
          done
          # Workaround for missing `/run/user/0`.
          sudo mkdir --mode="0700" --parents "/run/user/0"

          args=(
            --profile="${{ inputs.profile }}"
            --timeout="${BUILD_TIMEOUT}"
            --resume-id="${{ github.run_id }}"
          )
          if [[ -n "${{ inputs.seed_arch }}" ]]; then
            args+=(--arch="${{ inputs.seed_arch }}")
          fi
          if [[ -n "${{ inputs.seed_name }}" ]]; then
            args+=(--name="${{ inputs.seed_name }}")
          fi
          if [[ -n "${{ inputs.seed_stage }}" ]]; then
            args+=(--seed-stage="${{ inputs.seed_stage }}")
          fi
          if [[ "${{ inputs.workaround }}" == "true" ]]; then
            args+=(--workaround)
          fi

          sudo --preserve-env=${SUDO_PRESERVE_ENV} \
            bin/bootstrap.sh "${args[@]}"

  check-attempt-1:
    name: Check Resumes (After Attempt 1)
    needs: [setup, bootstrap-attempt-1]
    if: always() && needs.bootstrap-attempt-1.result == 'failure'
    runs-on: ubuntu-26.04
    outputs:
      has_resume: ${{ steps.check.outputs.has_resume }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@v6
        with:
          path: ~/.cache/tools
          key: tools-${{ runner.os }}-${{ env.TOOL_RCLONE_VERSION }}-${{ env.TOOL_STORAGETO_VERSION }}

      - name: Install Dependencies
        run: |
          mkdir --parents "${HOME}/.cache/tools"
          if [[ ! -x "${HOME}/.cache/tools/rclone" ]]; then
            aria2c --dir="/tmp" \
              "https://downloads.rclone.org/${TOOL_RCLONE_VERSION}/rclone-${TOOL_RCLONE_VERSION}-linux-amd64.zip"
            unzip -j "/tmp/rclone-${TOOL_RCLONE_VERSION}-linux-amd64.zip" \
              "*/rclone" -d "${HOME}/.cache/tools"
            rm --force "/tmp/rclone-${TOOL_RCLONE_VERSION}-linux-amd64.zip"
            chmod 0755 "${HOME}/.cache/tools/rclone"
          fi
          sudo cp "${HOME}/.cache/tools/rclone" /usr/local/bin/
          sudo chown root:root /usr/local/bin/rclone

      - name: Check S3 for Resume Snapshot
        id: check
        run: |
          source lib/common.sh
          source lib/build.sh
          profile="${{ inputs.profile }}"
          run_id="${{ github.run_id }}"
          found=""
          for stage in "stage1" "stage3-init" "stage3"; do
            if has_resume_stage "${profile}" "${run_id}" "${stage}"; then
              found="${stage}"
              break
            fi
          done
          if [[ -n "${found}" ]]; then
            log_info "Found ${found} resume snapshot for ${profile}"
            echo "has_resume=true" >> "$GITHUB_OUTPUT"
          else
            log_warn "No resume snapshot found for ${profile}"
            echo "has_resume=false" >> "$GITHUB_OUTPUT"
          fi

