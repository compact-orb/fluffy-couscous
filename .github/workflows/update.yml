name: Update

on:
  workflow_dispatch:

env:
  SUDO_PRESERVE_ENV: GENTOO_MIRROR_URL,REPOS,SIGNING_KEY,PUBLIC_KEYS,S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY,S3_REGION,S3_ENDPOINT,S3_BUCKET_NAME,SECUREBOOT_KEYS,SECUREBOOT_CERT
  GENTOO_MIRROR_URL: ${{ vars.GENTOO_MIRROR_URL }}
  REPOS: ${{ vars.REPOS }}
  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
  PUBLIC_KEYS: ${{ vars.PUBLIC_KEYS }}
  S3_ACCESS_KEY_ID: ${{ vars.S3_ACCESS_KEY_ID }}
  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
  S3_REGION: ${{ vars.S3_REGION }}
  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
  S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
  SECUREBOOT_KEYS: ${{ secrets.SECUREBOOT_KEYS }}
  SECUREBOOT_CERT: ${{ vars.SECUREBOOT_CERT }}

jobs:
  update:
    name: Update
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # TODO: Cache and dynamically find the latest version of rclone
      - name: Install rclone
        run: |
          aria2c --dir="/tmp" \
            "https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-linux-amd64.deb"
          sudo apt install --yes "/tmp/rclone-v1.75.2-linux-amd64.deb"
          rm "/tmp/rclone-v1.75.2-linux-amd64.deb"

      # TODO: Sepcify profile via env and run each in parallel
      - name: Run update script
        run: |
          sudo --preserve-env=${SUDO_PRESERVE_ENV} bin/update.sh \
            "automatic-journey:amd64/llvm-libstdc++-hardened-systemd-optimize-x86-64-v3"
