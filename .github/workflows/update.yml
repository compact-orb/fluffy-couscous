name: Update

on:
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          Space-separated package atoms to emerge oneshot before @system update
        required: false
        type: string
        default: ""
      usepkg_exclude:
        description: "Binary packages to exclude"
        required: false
        type: string
        default: ""
      skip_system:
        description: "Skip @system update"
        required: false
        type: boolean
        default: false
      jobs:
        description: "Enable parallel emerge jobs using nproc"
        required: false
        type: boolean
        default: false
        # default: true # For Avrea
      timeout:
        description: "Timeout duration for emerge (e.g. 330m)"
        required: false
        type: string
        default: "330m"
        # default: "" # Disabled for Avrea

jobs:
  update:
    name: Update
    uses: ./.github/workflows/_resumable-pipeline.yml
    with:
      mode: update
      max_attempts: 4
      # For Avrea:
      # runner: avrea-ubuntu-26.04-32-vcpu
      # github_hosted: false
      packages: ${{ inputs.packages }}
      usepkg_exclude: ${{ inputs.usepkg_exclude }}
      skip_system: ${{ inputs.skip_system }}
      jobs: ${{ inputs.jobs }}
      timeout: ${{ inputs.timeout }}
    secrets: inherit
