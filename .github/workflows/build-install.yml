name: Build Install

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile in repository:profile format"
        required: true
        type: string

env:
  SUDO_PRESERVE_ENV: "\
    SIGNING_KEY,S3_SECRET_ACCESS_KEY,S3_RO_SECRET_ACCESS_KEY,SECUREBOOT_KEY,\
    STORAGETO_KEY"
  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
  S3_RO_SECRET_ACCESS_KEY: ${{ secrets.S3_RO_SECRET_ACCESS_KEY }}
  SECUREBOOT_KEY: ${{ secrets.SECUREBOOT_KEY }}
  STORAGETO_KEY: ${{ secrets.STORAGETO_KEY }}

jobs:
  build-install:
    name: Build Install
    runs-on: ubuntu-26.04
    steps:
      - uses: compact-orb/optimize-runner-network@v1

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tools

      - name: Install Host Dependencies
        run: |
          sudo apt update
          sudo apt install --no-install-recommends --yes criu xorriso

      - name: Run build-install.sh
        run: |
          # Workaround for stripping carriage return characters from GitHub
          # Actions environment variables set via the web interface.
          for var in ${SUDO_PRESERVE_ENV//,/ }; do
            declare -n ref="${var}"
            ref="${ref//$'\r'/}"
          done
          # Workaround for missing `/run/user/0`.
          sudo mkdir --mode="0700" --parents "/run/user/0"

          sudo --preserve-env=${SUDO_PRESERVE_ENV} \
            bin/build-install.sh --profile="${{ inputs.profile }}"
