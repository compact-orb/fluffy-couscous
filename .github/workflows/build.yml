name: Build

on:
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          Space-separated package atoms (leave empty to build configured sets)
        required: false
        type: string
        default: ""
      pre_packages:
        description: >-
          Package atoms to emerge before --packages (defaults to config when
          packages is empty)
        required: false
        type: string
        default: ""
      usepkg_exclude:
        description: "Binary packages to exclude"
        required: false
        type: string
        default: ""
      clean_binpkgs:
        description: "Remove old binary packages that are not installed"
        required: false
        type: boolean
        default: false
      jobs:
        description: "Enable parallel emerge jobs using nproc"
        required: false
        type: boolean
        default: false
        # default: true # For Avrea
      timeout:
        description: "Timeout duration for emerge (e.g. 330m)"
        required: false
        type: string
        default: "330m"
        # default: "" # Disabled for Avrea

jobs:
  build:
    name: Build
    uses: ./.github/workflows/_resumable-pipeline.yml
    with:
      mode: build
      max_attempts: 8
      # For Avrea:
      # runner: avrea-ubuntu-26.04-32-vcpu
      # github_hosted: false
      packages: ${{ inputs.packages }}
      pre_packages: ${{ inputs.pre_packages }}
      usepkg_exclude: ${{ inputs.usepkg_exclude }}
      clean_binpkgs: ${{ inputs.clean_binpkgs }}
      jobs: ${{ inputs.jobs }}
      timeout: ${{ inputs.timeout }}
    secrets: inherit
