  cleanup:
    name: Cleanup Snapshots
    runs-on: ubuntu-26.04
    needs:
      - setup
      - build-attempt-1
      - check-attempt-1
      - build-attempt-2
      - check-attempt-2
      - build-attempt-3
      - check-attempt-3
      - build-attempt-4
    if: always()
    steps:
      - uses: compact-orb/optimize-runner-network@v1

      - uses: actions/checkout@v7

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@v6
        with:
          path: ~/.cache/tools
          key: >-
            tools-${{ runner.os }}-${{ env.TOOL_RCLONE_VERSION }}-${{
            env.TOOL_STORAGETO_VERSION }}

