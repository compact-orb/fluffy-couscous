name: Build

on:
  workflow_dispatch:
    inputs:
      custom_packages:
        description: >-
          Use packages and pre_packages inputs instead of environment variables
        required: false
        type: boolean
        default: false
      packages:
        description: "Space-separated package atoms"
        required: false
        type: string
        default: ""
      pre_packages:
        description: "Package atoms to emerge before --packages"
        required: false
        type: string
        default: ""
      usepkg_exclude:
        description: "Binary packages to exclude"
        required: false
        type: string
        default: ""
      clean_binpkgs:
        description: "Prune obsolete binary packages not installed"
        required: false
        type: boolean
        default: false
      jobs:
        description: "Enable parallel emerge jobs using nproc (defaults to 1)"
        required: false
        type: boolean
        default: false
      timeout:
        description: "Timeout duration for emerge (e.g. 330m or 30m)"
        required: false
        type: string
        default: "330m"

env:
  SUDO_PRESERVE_ENV: "\
    GENTOO_MIRROR_URL,REPOS,BINPKG_REPOS,SIGNING_KEY,BINPKG_PUBLIC_KEY,\
    REPO_PUBLIC_KEYS,S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY,S3_REGION,\
    S3_ENDPOINT,S3_BUCKET_NAME,SECUREBOOT_KEY,SECUREBOOT_CERT,STORAGETO_KEY"
  GENTOO_MIRROR_URL: ${{ vars.GENTOO_MIRROR_URL }}
  REPOS: ${{ vars.REPOS }}
  BINPKG_REPOS: ${{ vars.BINPKG_REPOS }}
  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
  BINPKG_PUBLIC_KEY: ${{ vars.BINPKG_PUBLIC_KEY }}
  REPO_PUBLIC_KEYS: ${{ vars.REPO_PUBLIC_KEYS }}
  S3_ACCESS_KEY_ID: ${{ vars.S3_ACCESS_KEY_ID }}
  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
  S3_REGION: ${{ vars.S3_REGION }}
  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
  S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
  SECUREBOOT_KEY: ${{ secrets.SECUREBOOT_KEY }}
  SECUREBOOT_CERT: ${{ vars.SECUREBOOT_CERT }}
  STORAGETO_KEY: ${{ secrets.STORAGETO_KEY }}
  PROFILES: ${{ vars.PROFILES }}
  BUILD_PRE_PACKAGES: ${{ vars.BUILD_PRE_PACKAGES }}
  BUILD_PACKAGES: ${{ vars.BUILD_PACKAGES }}
  BUILD_PACKAGES_A: ${{ vars.BUILD_PACKAGES_A }}
  PROFILES_A: ${{ vars.PROFILES_A }}
  INPUT_PRE_PACKAGES: ${{ inputs.pre_packages }}
  INPUT_PACKAGES: ${{ inputs.packages }}
  BUILD_USEPKG_EXCLUDE: ${{ inputs.usepkg_exclude }}
  BUILD_TIMEOUT: ${{ inputs.timeout || '330m' }}
  TOOL_RCLONE_VERSION: "v1.75.2"
  TOOL_STORAGETO_VERSION: "v0.5.0"

jobs:
  setup:
    name: Setup Matrix
    runs-on: ubuntu-26.04
    outputs:
      profiles: ${{ steps.matrix.outputs.profiles }}
    steps:
      - uses: compact-orb/optimize-runner-network@v1

      - uses: actions/checkout@v7

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@v6
        with:
          path: ~/.cache/tools
          key: >-
            tools-${{ runner.os }}-${{ env.TOOL_RCLONE_VERSION }}-${{
            env.TOOL_STORAGETO_VERSION }}

      - name: Install Dependencies
        run: |
          mkdir --parents "${HOME}/.cache/tools"
          if [[ ! -x "${HOME}/.cache/tools/rclone" ]]; then
            rclone_url="https://downloads.rclone.org/${TOOL_RCLONE_VERSION}"
            rclone_pkg="rclone-${TOOL_RCLONE_VERSION}-linux-amd64.zip"
            aria2c --dir="/tmp" "${rclone_url}/${rclone_pkg}"
            unzip -j "/tmp/${rclone_pkg}" \
              "*/rclone" -d "${HOME}/.cache/tools"
            rm --force "/tmp/${rclone_pkg}"
            chmod 0755 "${HOME}/.cache/tools/rclone"
          fi
          if [[ ! -x "${HOME}/.cache/tools/storageto" ]]; then
            sg_url="https://github.com/storageto/cli/releases/download"
            sg_pkg="storageto-linux-amd64.tar.gz"
            aria2c --dir="/tmp" \
              "${sg_url}/${TOOL_STORAGETO_VERSION}/${sg_pkg}"
            tar --directory="${HOME}/.cache/tools" --extract \
              --file="/tmp/${sg_pkg}"
            rm --force "/tmp/${sg_pkg}"
            chmod 0755 "${HOME}/.cache/tools/storageto"
          fi
          sudo mkdir --parents /usr/local/bin
          sudo cp "${HOME}/.cache/tools/rclone" \
            "${HOME}/.cache/tools/storageto" /usr/local/bin/
          sudo chown root:root /usr/local/bin/rclone /usr/local/bin/storageto

      - name: Prune Stale Snapshots
        run: |
          source lib/common.sh
          source lib/build.sh
          # Purge any abandoned resume snapshots older than 24 hours
          s3_rclone delete --min-age="24h" \
            ":s3:${S3_BUCKET_NAME}/resumes/" || true

      - name: Generate Profile Matrix
        id: matrix
        run: |
          PROFILES="${PROFILES//$'\r'/}"
          matrix_json=$(echo "${PROFILES}" | awk 'NF {
            if (n++) printf ", ";
            else printf "[";
            printf "\"%s\"", $0;
          } END {
            if (n) print "]";
            else print "[]";
          }')
          echo "profiles=${matrix_json}" >> "$GITHUB_OUTPUT"

  build-attempt-1:
    name: Build (Attempt 1)
    needs: setup
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.setup.outputs.profiles) }}
    steps:
      - uses: compact-orb/optimize-runner-network@v1

      - name: Load Kernel Modules
        run: |
          sudo modprobe --all \
            af_packet_diag btrfs fuse inet_diag netlink_diag overlay \
            raw_diag tcp_diag udp_diag unix_diag

      - uses: compact-orb/maximize-runner-storage@v2
        with:
          create-filesystem: 'false'

      - name: Install Host Dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install --yes \
            --no-install-recommends \
            aria2 btrfs-progs criu cryptsetup curl fuse3 gawk git gnupg udev \
            unzip util-linux-extra xz-utils zstd
          sudo apt clean

      - name: Initialize Runner Filesystem
        run: |
          free_bytes=$(df --output=avail --block-size=1 / | tail --lines=1)
          image_size=$(( free_bytes - 1073741824 ))

          sudo truncate --size="${image_size}" /btrfs.img
          sudo mkfs.btrfs --metadata single /btrfs.img

          sudo mkdir --parents /mnt/btrfs
          sudo mount \
            --options=loop,noatime,compress-force=zstd:3 \
            /btrfs.img /mnt/btrfs

          sudo mkdir --parents /mnt/btrfs/usr/local /usr/local
          sudo mount --bind /mnt/btrfs/usr/local /usr/local
          sudo mkdir --parents /usr/local/bin

          sudo mkdir --parents /mnt/btrfs/workspace "${GITHUB_WORKSPACE}"
          sudo mount --bind /mnt/btrfs/workspace "${GITHUB_WORKSPACE}"
          sudo chown "$(id --user):$(id --group)" "${GITHUB_WORKSPACE}"

      - uses: actions/checkout@v7

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@v6
        with:
          path: ~/.cache/tools
          key: >-
            tools-${{ runner.os }}-${{ env.TOOL_RCLONE_VERSION }}-${{
            env.TOOL_STORAGETO_VERSION }}

      - name: Install Dependencies
        run: |
          mkdir --parents "${HOME}/.cache/tools"
          if [[ ! -x "${HOME}/.cache/tools/rclone" ]]; then
            rclone_url="https://downloads.rclone.org/${TOOL_RCLONE_VERSION}"
            rclone_pkg="rclone-${TOOL_RCLONE_VERSION}-linux-amd64.zip"
            aria2c --dir="/tmp" "${rclone_url}/${rclone_pkg}"
            unzip -j "/tmp/${rclone_pkg}" \
              "*/rclone" -d "${HOME}/.cache/tools"
            rm --force "/tmp/${rclone_pkg}"
            chmod 0755 "${HOME}/.cache/tools/rclone"
          fi
          if [[ ! -x "${HOME}/.cache/tools/storageto" ]]; then
            sg_url="https://github.com/storageto/cli/releases/download"
            sg_pkg="storageto-linux-amd64.tar.gz"
            aria2c --dir="/tmp" \
              "${sg_url}/${TOOL_STORAGETO_VERSION}/${sg_pkg}"
            tar --directory="${HOME}/.cache/tools" --extract \
              --file="/tmp/${sg_pkg}"
            rm --force "/tmp/${sg_pkg}"
            chmod 0755 "${HOME}/.cache/tools/storageto"
          fi
          sudo mkdir --parents /usr/local/bin
          sudo cp "${HOME}/.cache/tools/rclone" \
            "${HOME}/.cache/tools/storageto" /usr/local/bin/
          sudo chown root:root /usr/local/bin/rclone /usr/local/bin/storageto

      - name: Run build.sh
        run: |
          # Workaround for stripping carriage return characters from GitHub
          # Actions environment variables set via the web interface.
          for var in ${SUDO_PRESERVE_ENV//,/ }; do
            declare -n ref="${var}"
            ref="${ref//$'\r'/}"
          done
          if [[ "${{ inputs.custom_packages }}" == "true" ]]; then
            BUILD_PRE_PACKAGES="${INPUT_PRE_PACKAGES}"
            BUILD_PACKAGES="${INPUT_PACKAGES}"
          elif grep --fixed-strings --line-regexp --quiet \
            "${{ matrix.profile }}" <<< "${PROFILES_A//$'\r'/}"; then
            BUILD_PACKAGES+=$'\n'"${BUILD_PACKAGES_A}"
          fi
          # Normalize BUILD_PACKAGES: strip # comments, CRs (not in
          # SUDO_PRESERVE_ENV), and convert newlines to spaces.
          BUILD_PRE_PACKAGES="$(
            sed 's/#.*//; s/\r//' <<< "${BUILD_PRE_PACKAGES}" | tr '\n' ' '
          )"
          BUILD_PACKAGES="$(
            sed 's/#.*//; s/\r//' <<< "${BUILD_PACKAGES}" | tr '\n' ' '
          )"
          BUILD_USEPKG_EXCLUDE="$(
            sed 's/#.*//; s/\r//' <<< "${BUILD_USEPKG_EXCLUDE}" | tr '\n' ' '
          )"
          # Workaround for missing `/run/user/0`.
          sudo mkdir --mode="0700" --parents "/run/user/0"
          args=(
            --profile="${{ matrix.profile }}"
            --pre-packages="${BUILD_PRE_PACKAGES}"
            --packages="${BUILD_PACKAGES}"
            --usepkg-exclude="${BUILD_USEPKG_EXCLUDE}"
            --timeout="${BUILD_TIMEOUT}"
            --resume-id="${{ github.run_id }}"
          )
          if [[ "${{ inputs.clean_binpkgs }}" == "true" ]]; then
            args+=(--clean)
          fi
          if [[ "${{ inputs.jobs }}" == "true" ]]; then
            args+=(--jobs)
          fi
          sudo --preserve-env=${SUDO_PRESERVE_ENV} \
            bin/build.sh "${args[@]}"

  check-attempt-1:
    name: Check Resumes (After Attempt 1)
    needs: [setup, build-attempt-1]
    if: >-
      always() && !cancelled() &&
      needs.build-attempt-1.result != 'skipped'
    runs-on: ubuntu-26.04
    outputs:
      has_resumes: ${{ steps.check.outputs.has_resumes }}
      profiles: ${{ steps.check.outputs.profiles }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@v6
        with:
          path: ~/.cache/tools
          key: >-
            tools-${{ runner.os }}-${{ env.TOOL_RCLONE_VERSION }}-${{
            env.TOOL_STORAGETO_VERSION }}

      - name: Install Dependencies
        run: |
          mkdir --parents "${HOME}/.cache/tools"
          if [[ ! -x "${HOME}/.cache/tools/rclone" ]]; then
            rclone_url="https://downloads.rclone.org/${TOOL_RCLONE_VERSION}"
            rclone_pkg="rclone-${TOOL_RCLONE_VERSION}-linux-amd64.zip"
            aria2c --dir="/tmp" "${rclone_url}/${rclone_pkg}"
            unzip -j "/tmp/${rclone_pkg}" \
              "*/rclone" -d "${HOME}/.cache/tools"
            rm --force "/tmp/${rclone_pkg}"
            chmod 0755 "${HOME}/.cache/tools/rclone"
          fi
          sudo mkdir --parents /usr/local/bin
          sudo cp "${HOME}/.cache/tools/rclone" /usr/local/bin/
          sudo chown root:root /usr/local/bin/rclone

      - name: Check S3 for Timed-Out Profiles
        id: check
        run: |
          source lib/common.sh
          source lib/build.sh
          PROFILES="${PROFILES//$'\r'/}"
          resuming=()
          while IFS= read -r profile || [[ -n "${profile}" ]]; do
            [[ -z "${profile}" ]] && continue
            if has_resume_stage "${profile}" \
              "${{ github.run_id }}" "stage3"; then
              resuming+=("${profile}")
            fi
          done <<< "${PROFILES}"

          if [[ ${#resuming[@]} -gt 0 ]]; then
            json=$(printf '%s\n' "${resuming[@]}" | awk 'NF {
              if (n++) printf ", ";
              else printf "[";
              printf "\"%s\"", $0;
            } END {
              print "]";
            }')
            echo "has_resumes=true" >> "$GITHUB_OUTPUT"
            echo "profiles=${json}" >> "$GITHUB_OUTPUT"
          else
            echo "has_resumes=false" >> "$GITHUB_OUTPUT"
            echo "profiles=[]" >> "$GITHUB_OUTPUT"
          fi

  build-attempt-2:
    name: Build (Attempt 2)
    needs: [setup, check-attempt-1]
    if: "!cancelled() && needs.check-attempt-1.outputs.has_resumes == 'true'"
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.check-attempt-1.outputs.profiles) }}
    steps:
      - uses: compact-orb/optimize-runner-network@v1

      - name: Load Kernel Modules
        run: |
          sudo modprobe --all \
            af_packet_diag btrfs fuse inet_diag netlink_diag overlay \
            raw_diag tcp_diag udp_diag unix_diag

      - uses: compact-orb/maximize-runner-storage@v2
        with:
          create-filesystem: 'false'

      - name: Install Host Dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install --yes \
            --no-install-recommends \
            aria2 btrfs-progs criu cryptsetup curl fuse3 gawk git gnupg udev \
            unzip util-linux-extra xz-utils zstd
          sudo apt clean

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@v6
        with:
          path: ~/.cache/tools
          key: >-
            tools-${{ runner.os }}-${{ env.TOOL_RCLONE_VERSION }}-${{
            env.TOOL_STORAGETO_VERSION }}

      - name: Install Dependencies
        run: |
          mkdir --parents "${HOME}/.cache/tools"
          if [[ ! -x "${HOME}/.cache/tools/rclone" ]]; then
            rclone_url="https://downloads.rclone.org/${TOOL_RCLONE_VERSION}"
            rclone_pkg="rclone-${TOOL_RCLONE_VERSION}-linux-amd64.zip"
            aria2c --dir="/tmp" "${rclone_url}/${rclone_pkg}"
            unzip -j "/tmp/${rclone_pkg}" \
              "*/rclone" -d "${HOME}/.cache/tools"
            rm --force "/tmp/${rclone_pkg}"
            chmod 0755 "${HOME}/.cache/tools/rclone"
          fi
          if [[ ! -x "${HOME}/.cache/tools/storageto" ]]; then
            sg_url="https://github.com/storageto/cli/releases/download"
            sg_pkg="storageto-linux-amd64.tar.gz"
            aria2c --dir="/tmp" \
              "${sg_url}/${TOOL_STORAGETO_VERSION}/${sg_pkg}"
            tar --directory="${HOME}/.cache/tools" --extract \
              --file="/tmp/${sg_pkg}"
            rm --force "/tmp/${sg_pkg}"
            chmod 0755 "${HOME}/.cache/tools/storageto"
          fi
          sudo mkdir --parents /usr/local/bin
          sudo cp "${HOME}/.cache/tools/rclone" \
            "${HOME}/.cache/tools/storageto" /usr/local/bin/
          sudo chown root:root /usr/local/bin/rclone /usr/local/bin/storageto

      - name: Download & Mount Resume Filesystem
        run: |
          repo_profile="${{ matrix.profile }}"
          repo_profile="${repo_profile#*:}"
          stage_prefix="stage3-${repo_profile//\//-}"
          image_filename="${stage_prefix}-resume-${{ github.run_id }}.img.zst"
          sig_filename="${image_filename}.sig"

          secret_key="${S3_SECRET_ACCESS_KEY:-${S3_RO_SECRET_ACCESS_KEY}}"

          mkdir --parents /tmp/resume
          rclone copy \
            --s3-access-key-id "${S3_ACCESS_KEY_ID}" \
            --s3-endpoint "${S3_ENDPOINT}" \
            --s3-no-check-bucket \
            --s3-provider "Other" \
            --s3-region "${S3_REGION}" \
            --s3-secret-access-key "${secret_key}" \
            --transfers "16" \
            --verbose \
            ":s3:${S3_BUCKET_NAME}/resumes/${image_filename}" \
            /tmp/resume/
          rclone copy \
            --s3-access-key-id "${S3_ACCESS_KEY_ID}" \
            --s3-endpoint "${S3_ENDPOINT}" \
            --s3-no-check-bucket \
            --s3-provider "Other" \
            --s3-region "${S3_REGION}" \
            --s3-secret-access-key "${secret_key}" \
            --transfers "16" \
            --verbose \
            ":s3:${S3_BUCKET_NAME}/resumes/${sig_filename}" \
            /tmp/resume/

          if [[ -n "${SIGNING_KEY:-}" ]]; then
            gpg --batch --import --quiet <<< "${SIGNING_KEY}"
          fi
          if [[ -n "${BINPKG_PUBLIC_KEY//[[:space:]]/}" ]]; then
            gpg --batch --import --quiet <<< "${BINPKG_PUBLIC_KEY}"
          fi
          gpg --batch --verify "/tmp/resume/${sig_filename}" \
            "/tmp/resume/${image_filename}"

          sudo zstd --decompress --sparse --force \
            "/tmp/resume/${image_filename}" -o /btrfs.img
          rm --recursive --force /tmp/resume

          sudo mkdir --parents /mnt/btrfs
          sudo mount \
            --options=loop,noatime,compress-force=zstd:3 \
            /btrfs.img /mnt/btrfs

          sudo mkdir --parents /mnt/btrfs/usr/local /usr/local
          sudo mount --bind /mnt/btrfs/usr/local /usr/local
          sudo mkdir --parents /usr/local/bin
          sudo cp "${HOME}/.cache/tools/rclone" \
            "${HOME}/.cache/tools/storageto" /usr/local/bin/
          sudo chown root:root /usr/local/bin/rclone /usr/local/bin/storageto

          sudo mkdir --parents /mnt/btrfs/workspace "${GITHUB_WORKSPACE}"
          sudo mount --bind /mnt/btrfs/workspace "${GITHUB_WORKSPACE}"
          sudo chown "$(id --user):$(id --group)" "${GITHUB_WORKSPACE}"

          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          sudo git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Run build.sh (Resume)
        run: |
          for var in ${SUDO_PRESERVE_ENV//,/ }; do
            declare -n ref="${var}"
            ref="${ref//$'\r'/}"
          done
          if [[ "${{ inputs.custom_packages }}" == "true" ]]; then
            BUILD_PRE_PACKAGES="${INPUT_PRE_PACKAGES}"
            BUILD_PACKAGES="${INPUT_PACKAGES}"
          elif grep --fixed-strings --line-regexp --quiet \
            "${{ matrix.profile }}" <<< "${PROFILES_A//$'\r'/}"; then
            BUILD_PACKAGES+=$'\n'"${BUILD_PACKAGES_A}"
          fi
          # Normalize BUILD_PACKAGES: strip # comments, CRs (not in
          # SUDO_PRESERVE_ENV), and convert newlines to spaces.
          BUILD_PRE_PACKAGES="$(
            sed 's/#.*//; s/\r//' <<< "${BUILD_PRE_PACKAGES}" | tr '\n' ' '
          )"
          BUILD_PACKAGES="$(
            sed 's/#.*//; s/\r//' <<< "${BUILD_PACKAGES}" | tr '\n' ' '
          )"
          BUILD_USEPKG_EXCLUDE="$(
            sed 's/#.*//; s/\r//' <<< "${BUILD_USEPKG_EXCLUDE}" | tr '\n' ' '
          )"
          sudo mkdir --mode="0700" --parents "/run/user/0"
          args=(
            --profile="${{ matrix.profile }}"
            --pre-packages="${BUILD_PRE_PACKAGES}"
            --packages="${BUILD_PACKAGES}"
            --usepkg-exclude="${BUILD_USEPKG_EXCLUDE}"
            --timeout="${BUILD_TIMEOUT}"
            --resume-id="${{ github.run_id }}"
            --resume
          )
          if [[ "${{ inputs.clean_binpkgs }}" == "true" ]]; then
            args+=(--clean)
          fi
          if [[ "${{ inputs.jobs }}" == "true" ]]; then
            args+=(--jobs)
          fi
          sudo --preserve-env=${SUDO_PRESERVE_ENV} \
            bin/build.sh "${args[@]}"

  check-attempt-2:
    name: Check Resumes (After Attempt 2)
    needs: [setup, build-attempt-2]
    if: >-
      always() && !cancelled() &&
      needs.build-attempt-2.result != 'skipped'
    runs-on: ubuntu-26.04
    outputs:
      has_resumes: ${{ steps.check.outputs.has_resumes }}
      profiles: ${{ steps.check.outputs.profiles }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@v6
        with:
          path: ~/.cache/tools
          key: >-
            tools-${{ runner.os }}-${{ env.TOOL_RCLONE_VERSION }}-${{
            env.TOOL_STORAGETO_VERSION }}

      - name: Install Dependencies
        run: |
          mkdir --parents "${HOME}/.cache/tools"
          if [[ ! -x "${HOME}/.cache/tools/rclone" ]]; then
            rclone_url="https://downloads.rclone.org/${TOOL_RCLONE_VERSION}"
            rclone_pkg="rclone-${TOOL_RCLONE_VERSION}-linux-amd64.zip"
            aria2c --dir="/tmp" "${rclone_url}/${rclone_pkg}"
            unzip -j "/tmp/${rclone_pkg}" \
              "*/rclone" -d "${HOME}/.cache/tools"
            rm --force "/tmp/${rclone_pkg}"
            chmod 0755 "${HOME}/.cache/tools/rclone"
          fi
          sudo mkdir --parents /usr/local/bin
          sudo cp "${HOME}/.cache/tools/rclone" /usr/local/bin/
          sudo chown root:root /usr/local/bin/rclone

      - name: Check S3 for Timed-Out Profiles
        id: check
        run: |
          source lib/common.sh
          source lib/build.sh
          PROFILES="${PROFILES//$'\r'/}"
          resuming=()
          while IFS= read -r profile || [[ -n "${profile}" ]]; do
            [[ -z "${profile}" ]] && continue
            if has_resume_stage "${profile}" \
              "${{ github.run_id }}" "stage3"; then
              resuming+=("${profile}")
            fi
          done <<< "${PROFILES}"

          if [[ ${#resuming[@]} -gt 0 ]]; then
            json=$(printf '%s\n' "${resuming[@]}" | awk 'NF {
              if (n++) printf ", ";
              else printf "[";
              printf "\"%s\"", $0;
            } END {
              print "]";
            }')
            echo "has_resumes=true" >> "$GITHUB_OUTPUT"
            echo "profiles=${json}" >> "$GITHUB_OUTPUT"
          else
            echo "has_resumes=false" >> "$GITHUB_OUTPUT"
            echo "profiles=[]" >> "$GITHUB_OUTPUT"
          fi

  build-attempt-3:
    name: Build (Attempt 3)
    needs: [setup, check-attempt-2]
    if: "!cancelled() && needs.check-attempt-2.outputs.has_resumes == 'true'"
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.check-attempt-2.outputs.profiles) }}
    steps:
      - uses: compact-orb/optimize-runner-network@v1

      - name: Load Kernel Modules
        run: |
          sudo modprobe --all \
            af_packet_diag btrfs fuse inet_diag netlink_diag overlay \
            raw_diag tcp_diag udp_diag unix_diag

      - uses: compact-orb/maximize-runner-storage@v2
        with:
          create-filesystem: 'false'

      - name: Install Host Dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install --yes \
            --no-install-recommends \
            aria2 btrfs-progs criu cryptsetup curl fuse3 gawk git gnupg udev \
            unzip util-linux-extra xz-utils zstd
          sudo apt clean

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@v6
        with:
          path: ~/.cache/tools
          key: >-
            tools-${{ runner.os }}-${{ env.TOOL_RCLONE_VERSION }}-${{
            env.TOOL_STORAGETO_VERSION }}

      - name: Install Dependencies
        run: |
          mkdir --parents "${HOME}/.cache/tools"
          if [[ ! -x "${HOME}/.cache/tools/rclone" ]]; then
            rclone_url="https://downloads.rclone.org/${TOOL_RCLONE_VERSION}"
