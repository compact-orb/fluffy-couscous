name: Build

on:
  workflow_dispatch:

env:
  SUDO_PRESERVE_ENV: GENTOO_MIRROR_URL,REPOS,SIGNING_KEY,PUBLIC_KEYS,S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY,S3_REGION,S3_ENDPOINT,S3_BUCKET_NAME,SECUREBOOT_KEY,SECUREBOOT_CERT
  GENTOO_MIRROR_URL: ${{ vars.GENTOO_MIRROR_URL }}
  REPOS: ${{ vars.REPOS }}
  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
  PUBLIC_KEYS: ${{ vars.PUBLIC_KEYS }}
  S3_ACCESS_KEY_ID: ${{ vars.S3_ACCESS_KEY_ID }}
  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
  S3_REGION: ${{ vars.S3_REGION }}
  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
  S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
  SECUREBOOT_KEY: ${{ secrets.SECUREBOOT_KEY }}
  SECUREBOOT_CERT: ${{ vars.SECUREBOOT_CERT }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # TODO: Cache and dynamically find the latest version of rclone
      - name: Install rclone
        run: |
          aria2c --dir="/tmp" \
            "https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-linux-amd64.deb"
          sudo apt install --yes "/tmp/rclone-v1.75.2-linux-amd64.deb"
          rm "/tmp/rclone-v1.75.2-linux-amd64.deb"

      # TODO: Sepcify profile via env and run each in parallel
      - name: Run build.sh
        run: |
          # Workaround for stripping carriage return characters from GitHub
          # Actions environment variables set via the web interface.
          for var in ${SUDO_PRESERVE_ENV//,/ }; do
            declare -n ref="${var}"
            ref="${ref//$'\r'/}"
          done
          # Workaround for missing `/run/user/0`.
          sudo mkdir --mode="0700" --parents "/run/user/0"
          sudo --preserve-env=${SUDO_PRESERVE_ENV} bin/build.sh \
            "automatic-journey:amd64/llvm-libstdc++-hardened-systemd-optimize-x86-64-v3" \
            "app-admin/sudo app-arch/7zip app-emulation/cloud-init sys-kernel/gentoo-kernel sys-kernel/installkernel sys-kernel/linux-firmware sys-firmware/intel-microcode sys-firmware/sof-firmware sys-boot/shim sys-fs/squashfs-tools sys-fs/dosfstools sys-fs/e2fsprogs sys-fs/btrfs-progs sys-fs/xfsprogs net-misc/networkmanager app-editors/nano"
