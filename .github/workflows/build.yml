name: Build

on:
  workflow_dispatch:

env:
  SUDO_PRESERVE_ENV: GENTOO_MIRROR_URL,REPOS,BINPKG_REPOS,SIGNING_KEY,BINPKG_PUBLIC_KEY,REPO_PUBLIC_KEYS,S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY,S3_REGION,S3_ENDPOINT,S3_BUCKET_NAME,SECUREBOOT_KEY,SECUREBOOT_CERT,STORAGETO_KEY
  GENTOO_MIRROR_URL: ${{ vars.GENTOO_MIRROR_URL }}
  REPOS: ${{ vars.REPOS }}
  BINPKG_REPOS: ${{ vars.BINPKG_REPOS }}
  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
  BINPKG_PUBLIC_KEY: ${{ vars.BINPKG_PUBLIC_KEY }}
  REPO_PUBLIC_KEYS: ${{ vars.REPO_PUBLIC_KEYS }}
  S3_ACCESS_KEY_ID: ${{ vars.S3_ACCESS_KEY_ID }}
  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
  S3_REGION: ${{ vars.S3_REGION }}
  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
  S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
  SECUREBOOT_KEY: ${{ secrets.SECUREBOOT_KEY }}
  SECUREBOOT_CERT: ${{ vars.SECUREBOOT_CERT }}
  STORAGETO_KEY: ${{ secrets.STORAGETO_KEY }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # TODO: Cache and dynamically find the latest version
      - name: Install Dependencies
        run: |
          aria2c --dir="/tmp" \
            "https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-linux-amd64.deb"
          sudo apt update; sudo apt install --yes \
            /tmp/rclone-v1.75.2-linux-amd64.deb xorriso
          rm "/tmp/rclone-v1.75.2-linux-amd64.deb"
          aria2c --dir="/tmp" \
            "https://github.com/storageto/cli/releases/download/v0.5.0/storageto-linux-amd64.tar.gz"
          tar --extract --file="/tmp/storageto-linux-amd64.tar.gz" \
            --directory="/tmp"
          sudo mv /tmp/storageto "/usr/local/bin/storageto"
          sudo chown root:root "/usr/local/bin/storageto"
          rm "/tmp/storageto-linux-amd64.tar.gz"

      # TODO: Specify profile via env and run each in parallel
      - name: Run build.sh
        run: |
          # Workaround for stripping carriage return characters from GitHub
          # Actions environment variables set via the web interface.
          for var in ${SUDO_PRESERVE_ENV//,/ }; do
            declare -n ref="${var}"
            ref="${ref//$'\r'/}"
          done
          # Workaround for missing `/run/user/0`.
          sudo mkdir --mode="0700" --parents "/run/user/0"
          sudo --preserve-env=${SUDO_PRESERVE_ENV} bin/build.sh \
            --profile="automatic-journey:amd64/llvm-libstdc++-hardened-systemd-optimize-x86-64-v3" \
            --packages="app-admin/ansible app-admin/sudo app-arch/7zip app-crypt/tpm2-tools app-editors/nano app-emulation/cloud-init app-forensics/lynis dev-vcs/git net-misc/networkmanager sys-apps/apparmor sys-apps/apparmor-utils sys-boot/shim sys-firmware/intel-microcode sys-firmware/sof-firmware sys-fs/btrfs-progs sys-fs/dosfstools sys-fs/e2fsprogs sys-fs/squashfs-tools sys-fs/xfsprogs sys-kernel/gentoo-kernel sys-kernel/installkernel sys-kernel/linux-firmware sys-process/audit"
