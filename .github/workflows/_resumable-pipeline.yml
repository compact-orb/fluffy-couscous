name: Resumable Pipeline

on:
  workflow_call:
    inputs:
      mode:
        description: Mode to run (bootstrap, build, or update)
        required: true
        type: string
      max_attempts:
        description: Maximum number of build attempts (1 to 8)
        required: false
        type: number
        default: 8
      runner:
        description: GitHub Actions runner label
        required: false
        type: string
        default: ubuntu-26.04
      github_hosted:
        description: >-
          Use GitHub-hosted runner setup, Btrfs loopback image, and CRIU resume
        required: false
        type: boolean
        default: true
      profile:
        description: Single profile for bootstrap mode
        required: false
        type: string
        default: ""
      seed_arch:
        description: Stage seed architecture (bootstrap)
        required: false
        type: string
        default: ""
      seed_name:
        description: Stage seed tarball name (bootstrap)
        required: false
        type: string
        default: ""
      seed_stage:
        description: Custom stage3 profile to use as seed (bootstrap)
        required: false
        type: string
        default: ""
      workaround:
        description: >-
          Apply bootstrap workaround instead of full rebuild (bootstrap)
        required: false
        type: boolean
        default: false
      packages:
        description: Space-separated package atoms (build/update)
        required: false
        type: string
        default: ""
      pre_packages:
        description: Package atoms to emerge before --packages (build)
        required: false
        type: string
        default: ""
      usepkg_exclude:
        description: Binary packages to exclude (build/update)
        required: false
        type: string
        default: ""
      clean_binpkgs:
        description: Remove old binary packages that are not installed (build)
        required: false
        type: boolean
        default: false
      skip_system:
        description: Skip @system update (update)
        required: false
        type: boolean
        default: false
      jobs:
        description: Enable parallel emerge jobs using nproc
        required: false
        type: boolean
        default: false
      timeout:
        description: Timeout duration for emerge (e.g. 330m)
        required: false
        type: string
        default: "330m"

env:
  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

jobs:
  setup:
    name: Setup
    runs-on: ${{ inputs.runner }}
    outputs:
      profiles: ${{ steps.matrix.outputs.profiles }}
    steps:
      - if: ${{ inputs.github_hosted }}
        uses: compact-orb/optimize-runner-network@v1

      - uses: actions/checkout@v7

      - if: ${{ inputs.github_hosted }}
        uses: ./.github/actions/setup-tools

      - name: Prune Stale Snapshots
        if: ${{ inputs.github_hosted }}
        run: |
          source lib/common.sh
          source lib/build.sh
          # Delete unfinished resume snapshots older than 24 hours
          s3_rclone delete --min-age="24h" \
            ":s3:${S3_BUCKET_NAME}/resumes/" || true

      - name: Generate Profile Matrix
        id: matrix
        env:
          MODE: ${{ inputs.mode }}
          INPUT_PROFILE: ${{ inputs.profile }}
        run: |
          if [[ "${MODE}" == "bootstrap" ]]; then
            matrix_json="$(jq --arg profile "${INPUT_PROFILE//$'\r'/}" \
              --compact-output --null-input '[$profile]')"
          else
            source lib/common.sh
            matrix_json="$(list_profiles | \
              jq --compact-output --raw-input --slurp \
              '[split("\n")[] | select(test("\\S"))]')"
          fi
          echo "profiles=${matrix_json}" >> "$GITHUB_OUTPUT"

  attempt-1:
    name: Attempt 1
    needs: setup
    if: needs.setup.outputs.profiles != '[]'
    uses: ./.github/workflows/_resumable-attempt.yml
    with:
      attempt: 1
      check_resume: ${{ inputs.github_hosted && inputs.max_attempts > 1 }}
      profiles: ${{ needs.setup.outputs.profiles }}
      config: ${{ toJson(inputs) }}
    secrets: inherit

  attempt-2:
    name: Attempt 2
    needs: attempt-1
    if: >-
      always() && !cancelled() &&
      needs.attempt-1.outputs.has_resumes == 'true'
    uses: ./.github/workflows/_resumable-attempt.yml
    with:
      attempt: 2
      check_resume: ${{ inputs.max_attempts > 2 }}
      profiles: ${{ needs.attempt-1.outputs.profiles }}
      resume_stage: ${{ needs.attempt-1.outputs.resume_stage }}
      config: ${{ toJson(inputs) }}
    secrets: inherit

  attempt-3:
    name: Attempt 3
    needs: attempt-2
    if: >-
      always() && !cancelled() &&
      needs.attempt-2.outputs.has_resumes == 'true'
    uses: ./.github/workflows/_resumable-attempt.yml
    with:
      attempt: 3
      check_resume: ${{ inputs.max_attempts > 3 }}
      profiles: ${{ needs.attempt-2.outputs.profiles }}
      resume_stage: ${{ needs.attempt-2.outputs.resume_stage }}
      config: ${{ toJson(inputs) }}
    secrets: inherit

  attempt-4:
    name: Attempt 4
    needs: attempt-3
    if: >-
      always() && !cancelled() &&
      needs.attempt-3.outputs.has_resumes == 'true'
    uses: ./.github/workflows/_resumable-attempt.yml
    with:
      attempt: 4
      check_resume: ${{ inputs.max_attempts > 4 }}
      profiles: ${{ needs.attempt-3.outputs.profiles }}
      resume_stage: ${{ needs.attempt-3.outputs.resume_stage }}
      config: ${{ toJson(inputs) }}
    secrets: inherit

  attempt-5:
    name: Attempt 5
    needs: attempt-4
    if: >-
      always() && !cancelled() &&
      needs.attempt-4.outputs.has_resumes == 'true'
    uses: ./.github/workflows/_resumable-attempt.yml
    with:
      attempt: 5
      check_resume: ${{ inputs.max_attempts > 5 }}
      profiles: ${{ needs.attempt-4.outputs.profiles }}
      resume_stage: ${{ needs.attempt-4.outputs.resume_stage }}
      config: ${{ toJson(inputs) }}
    secrets: inherit

  attempt-6:
    name: Attempt 6
    needs: attempt-5
    if: >-
      always() && !cancelled() &&
      needs.attempt-5.outputs.has_resumes == 'true'
    uses: ./.github/workflows/_resumable-attempt.yml
    with:
      attempt: 6
      check_resume: ${{ inputs.max_attempts > 6 }}
      profiles: ${{ needs.attempt-5.outputs.profiles }}
      resume_stage: ${{ needs.attempt-5.outputs.resume_stage }}
      config: ${{ toJson(inputs) }}
    secrets: inherit

  attempt-7:
    name: Attempt 7
    needs: attempt-6
    if: >-
      always() && !cancelled() &&
      needs.attempt-6.outputs.has_resumes == 'true'
    uses: ./.github/workflows/_resumable-attempt.yml
    with:
      attempt: 7
      check_resume: ${{ inputs.max_attempts > 7 }}
      profiles: ${{ needs.attempt-6.outputs.profiles }}
      resume_stage: ${{ needs.attempt-6.outputs.resume_stage }}
      config: ${{ toJson(inputs) }}
    secrets: inherit

  attempt-8:
    name: Attempt 8
    needs: attempt-7
    if: >-
      always() && !cancelled() &&
      needs.attempt-7.outputs.has_resumes == 'true'
    uses: ./.github/workflows/_resumable-attempt.yml
    with:
      attempt: 8
      check_resume: false
      profiles: ${{ needs.attempt-7.outputs.profiles }}
      resume_stage: ${{ needs.attempt-7.outputs.resume_stage }}
      config: ${{ toJson(inputs) }}
    secrets: inherit

  cleanup:
    name: Cleanup Snapshots
    runs-on: ${{ inputs.runner }}
    needs:
      - setup
      - attempt-1
      - attempt-2
      - attempt-3
      - attempt-4
      - attempt-5
      - attempt-6
      - attempt-7
      - attempt-8
    if: always() && inputs.github_hosted
    steps:
      - uses: compact-orb/optimize-runner-network@v1

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tools
        with:
          storageto: "false"

      - name: Purge Run Snapshots
        env:
          MODE: ${{ inputs.mode }}
        run: |
          source lib/common.sh
          source lib/build.sh
          include="stage3-*-resume-${{ github.run_id }}.*"
          if [[ "${MODE}" == "bootstrap" ]]; then
            include="*-resume-${{ github.run_id }}.*"
          fi
          s3_rclone delete ":s3:${S3_BUCKET_NAME}/resumes/" \
            --include="${include}" || true
