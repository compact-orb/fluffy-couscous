name: Run Script
description: Run a script with sudo and GitHub Actions env-var workarounds

inputs:
  sudo-preserve-env:
    description: Comma-separated list of environment variable names to preserve
    required: true
  script:
    description: The command to run with sudo
    required: true

runs:
  using: composite
  steps:
    - name: Run script
      shell: bash
      env:
        SUDO_PRESERVE_ENV: ${{ inputs.sudo-preserve-env }}
      run: |
        # Workaround for stripping carriage return characters from GitHub
        # Actions environment variables set via the web interface.
        for var in ${SUDO_PRESERVE_ENV//,/ }; do
          declare -n ref="${var}"
          ref="${ref//$'\r'/}"
        done
        # Workaround for missing `/run/user/0`.
        sudo mkdir --mode="0700" --parents "/run/user/0"
        sudo --preserve-env=${SUDO_PRESERVE_ENV} ${{ inputs.script }}
