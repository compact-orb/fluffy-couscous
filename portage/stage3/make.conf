EMERGE_DEFAULT_OPTS="--buildpkg --usepkg --with-bdeps=y"
CONFIG_PROTECT="-*"
INSTALL_MASK="/boot"
BINPKG_COMPRESS="zstd"
BINPKG_COMPRESS_FLAGS="-22 -T0 --ultra --long"
BINPKG_GPG_SIGNING_GPG_HOME="/var/lib/portage/gnupg-sign"
FEATURES="binpkg-signing gpg-keepalive"
# Temp just for remembering
SECUREBOOT_SIGN_KEY="/root/secureboot/db.key"
SECUREBOOT_SIGN_CERT="/root/secureboot/db.pem"
MODULES_SIGN_KEY="/root/secureboot/db.key"
MODULES_SIGN_CERT="/root/secureboot/db.pem"
