EMERGE_DEFAULT_OPTS="--buildpkg --usepkg --with-bdeps=y"
CLEAN_DELAY="0"
EMERGE_WARNING_DELAY="0"
EPAUSE_IGNORE="1"
EBEEP_IGNORE="1"
CONFIG_PROTECT="-*"
BINPKG_COMPRESS="zstd"
BINPKG_COMPRESS_FLAGS="-22 -T0 --ultra --long"
BINPKG_GPG_SIGNING_GPG_HOME="/var/lib/portage/gnupg-sign"
FEATURES="binpkg-signing gpg-keepalive"
SECUREBOOT_SIGN_KEY="/var/lib/portage/secureboot/db.key"
SECUREBOOT_SIGN_CERT="/var/lib/portage/secureboot/db.pem"
MODULES_SIGN_KEY="/var/lib/portage/secureboot/db.key"
MODULES_SIGN_CERT="/var/lib/portage/secureboot/db.pem"
