EMERGE_DEFAULT_OPTS="--buildpkg --quiet-build --usepkg --verbose --with-bdeps=y"
CLEAN_DELAY="0"
EMERGE_WARNING_DELAY="0"
EPAUSE_IGNORE="1"
EBEEP_IGNORE="1"
CONFIG_PROTECT="-*"
BINPKG_COMPRESS="zstd"
BINPKG_COMPRESS_FLAGS="--long --threads=0 --ultra -22"
BINPKG_GPG_SIGNING_GPG_HOME="/var/lib/portage/gnupg-sign"
FEATURES="binpkg-signing -cgroup -gpg-keepalive -ipc-sandbox -mount-sandbox -network-sandbox -parallel-fetch -pid-sandbox -sandbox -userfetch -userpriv -usersandbox -usersync"
